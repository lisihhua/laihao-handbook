<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新人商品手冊｜來好</title>
<style>
:root{--blue-soft:#E6F5FC;--red:#EC715E;--blue:#30B0E6;--gold:#F8BF85;--line:#ccc;--txt:#515856;--sub:#666;--soft:#f7f7f7}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:140px}
body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;background:#fff;color:var(--txt);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
.logo{display:block;height:34px;width:auto}
.brandbar{display:flex;height:4px}.brandbar i{flex:1;display:block}
.brandbar i:nth-child(1){background:var(--red)}.brandbar i:nth-child(2){background:var(--blue)}.brandbar i:nth-child(3){background:var(--gold)}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
header .in{max-width:1500px;margin:0 auto;padding:10px 14px 10px}
.r1{display:flex;align-items:center;gap:10px}
header h1{font-size:18px;font-weight:700;line-height:1.25;flex:1;min-width:0}
header .cnt{font-size:12px;color:var(--sub);display:block;font-weight:400;margin-top:1px}
.qz{border:1px solid var(--line);background:#fff;color:var(--txt);border-radius:6px;font-size:13px;font-weight:700;padding:0 10px;height:34px;line-height:32px;text-decoration:none;white-space:nowrap}
.qz:hover,.qz[aria-expanded="true"]{border-color:var(--blue)}
button.qz{cursor:pointer;font-family:inherit}
.qz .car{display:inline-block;margin-left:4px;font-size:10px;transition:transform .15s}
.qz[aria-expanded="true"] .car{transform:rotate(180deg)}
.qzw{position:relative}
#quizMenu{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:220px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px #0002;padding:6px}
#quizMenu.on{display:block}
#quizMenu a{display:block;padding:10px 12px;border-radius:6px;color:var(--txt);text-decoration:none;font-size:15px;font-weight:700;line-height:1.3}
#quizMenu a small{display:block;font-size:12px;font-weight:400;color:var(--sub);margin-top:2px}
#quizMenu a:hover,#quizMenu a:focus{background:var(--blue-soft);outline:0}
@media(max-width:480px){.qz,#menuBtn{padding:0 8px;font-size:12px}.r1{gap:6px}}
#q{display:block;width:100%;max-width:560px;margin-top:8px;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--txt)}
#q:focus,#pw:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 2px #30B0E633}
#menuBtn{display:none;background:#fff;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:0 10px;height:34px;font-size:13px;font-weight:700;cursor:pointer}
.layout{display:flex;align-items:flex-start;max-width:1500px;margin:0 auto}
nav{position:sticky;top:130px;width:250px;flex:0 0 250px;max-height:calc(100vh - 140px);overflow:auto;padding:10px;background:#fff;border-right:1px solid var(--line);font-size:13px}
nav a{display:block;padding:5px 6px;color:var(--txt);text-decoration:none;border-radius:4px}
nav a:hover{background:var(--soft)}
nav a b{color:var(--blue);font-weight:700;margin-right:6px}
nav a i{float:right;color:#999;font-style:normal}
main{flex:1;padding:14px;min-width:0}
section.v{margin-bottom:28px}
section.v h2{font-size:18px;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:12px}
section.v h2 small{font-size:13px;color:var(--blue);margin-right:8px}
section.v h2 em{font-size:12px;color:var(--sub);font-style:normal;margin-left:8px;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column}
.ph{aspect-ratio:1/1;background:#fff;border:1px solid #eee;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:6px;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:contain}
.ph.miss{background:var(--soft);color:#999;font-size:13px;cursor:default;text-align:center;padding:6px}
.pn{font-weight:700;font-size:14px;line-height:1.35;min-height:2.7em}
.inf{font-size:12px;color:var(--sub);margin-top:4px}
.pr{margin-top:auto;padding-top:4px;font-size:18px;font-weight:700;color:var(--txt)}
.bc{font-size:11px;color:#999;word-break:break-all}
.r2{display:grid;grid-template-columns:320px 1fr 320px;align-items:center;gap:8px 12px;margin-top:8px}
.r2 #stores{justify-self:center}
.r2 #q{margin-top:0;flex:0 1 320px;width:320px;max-width:320px;padding:8px 12px;font-size:15px;height:40px}
#stores{display:none;gap:0;border:1px solid #d9d9d9;border-radius:10px;overflow:hidden;flex:0 0 auto;background:#fff}
#stores.on{display:inline-flex}
#stores button{border:0;border-left:1px solid #d9d9d9;background:#fff;color:var(--txt);font-size:17px;font-weight:700;letter-spacing:.05em;padding:0 24px;height:44px;cursor:pointer;white-space:nowrap}
#stores button:first-child{border-left:0}
#stores button:hover{background:var(--blue-soft)}
#stores button.cur{background:var(--blue);color:#fff}
#stores button.cur+button{border-left-color:var(--blue)}
.tags{display:none;flex-wrap:wrap;gap:4px;margin-top:4px}
body.all .tags{display:flex}
.tags span{font-size:11px;line-height:1.5;padding:0 6px;border:1px solid var(--line);border-radius:10px;color:var(--sub);background:#fff}
.tags span.no{border-style:dashed;color:#999}
@media(max-width:800px){.r2{display:flex;flex-wrap:wrap}.r2 #q{flex:1 1 100%;width:100%;max-width:none;font-size:16px;height:42px}#stores.on{display:flex;width:100%}#stores button{flex:1;padding:0 6px;font-size:16px;height:44px}}
#none{display:none;padding:40px;text-align:center;color:var(--sub)}
footer{padding:16px;text-align:center;font-size:12px;color:var(--sub)}
#top{position:fixed;right:14px;bottom:14px;background:var(--txt);color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:18px;cursor:pointer}
#lb{display:none;position:fixed;inset:0;z-index:200;background:#fffffffa;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff}
@media(max-width:800px){
 #menuBtn{display:block}
 nav{display:none;position:fixed;top:0;left:0;bottom:0;width:80%;max-width:320px;max-height:none;z-index:30;box-shadow:2px 0 8px #0002;padding-top:16px}
 nav.open{display:block}
 html{scroll-padding-top:190px}
 .grid{grid-template-columns:repeat(2,1fr);gap:8px}
 main{padding:8px}
 .r1{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:6px}.r1 .logo{grid-column:1;grid-row:1}.r1 .qzw{grid-row:1;grid-column:2/4;justify-self:end}#quizMenu a{padding:12px 14px;font-size:16px}header h1{font-size:16px;grid-column:1/3;grid-row:2}#menuBtn{grid-column:3;grid-row:2}
 header .in{padding:8px 10px}
}
#lock{position:fixed;inset:0;z-index:100;background:#fff;display:flex;align-items:center;justify-content:center;padding:20px}
#lock .box{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:100%;max-width:380px}
#lock .in{padding:26px 24px 24px}
#lock h1{font-size:20px;font-weight:700;margin:18px 0 20px;line-height:1.3}
#pw{width:100%;padding:13px 14px;font-size:16px;border:1px solid var(--line);border-radius:8px}
#lock label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);margin:12px 0 16px}
#go{width:100%;padding:13px;font-size:16px;font-weight:700;background:var(--txt);color:#fff;border:0;border-radius:8px;cursor:pointer}
#go:disabled{opacity:.6}
#err{color:#c4513f;font-size:13px;min-height:1.4em;margin-top:8px}
#app{display:none}
</style>
</head>
<body>
<div id="lock"><div class="box"><div class="brandbar"><i></i><i></i><i></i></div><div class="in"><img class="logo" alt="來好 LAI HAO">
<h1>新人商品手冊</h1>
<input id="pw" type="password" placeholder="請輸入密碼" autocomplete="current-password"><div id="err"></div>
<label><input id="rem" type="checkbox"> 記住密碼</label>
<button id="go" type="button">進入</button></div></div></div>
<div id="app">
<header>
 <div class="in">
 <div class="r1"><img class="logo" alt="來好 LAI HAO"><h1>新人商品手冊<span class="cnt" id="cnt"></span></h1>
 <button id="menuBtn">廠商目錄</button><div class="qzw"><button class="qz" id="quizBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="quizMenu">測驗<span class="car">▼</span></button><div id="quizMenu" role="menu"><a role="menuitem" href="./quiz/">1–50 測驗<small>熱銷前 50 名</small></a><a role="menuitem" href="./quiz-51-100/">51–100 測驗<small>熱銷第 51–100 名</small></a><a role="menuitem" href="./quiz-monthly/">每月門市考試<small>前 50 名價格＋當月活動・10 號前完成</small></a></div></div></div>
 <div class="r2"><input id="q" type="search" placeholder="搜尋品名、廠商名、廠商代號、條碼" autocomplete="off"><div id="stores" role="tablist" aria-label="店別"></div></div>
 </div>
 <div class="brandbar"><i></i><i></i><i></i></div>
</header>
<div class="layout">
 <nav id="nav"></nav>
 <main id="main"><div id="none">找不到符合的商品</div></main>
</div>

const META={"salt": "ZyZDvGjNkWJiiW+gZAQ80w==", "iter": 310000, "data": "d8f9ce790848b.bin"};
let DATA=[];
const $=s=>document.querySelector(s);

const main=$("#main"),nav=$("#nav");
let total=0,photos=0;
const ALL="全部",LS_STORE="handbook_store";let SO=[],DEF=ALL,STORE=ALL;
function render(){
SO=(DATA[0]&&DATA[0].so)||[];DEF=(DATA[0]&&DATA[0].ds)||ALL;if(DEF!==ALL&&!SO.includes(DEF))DEF=ALL;
const secs=DATA.map(v=>{
 const s=document.createElement("section");s.className="v";s.id="v-"+v.code;
 s.innerHTML=`<h2><small>${esc(v.code)}</small>${esc(v.name)}<em>${v.items.length} 項</em></h2><div class="grid">`+
 v.items.map(i=>{total++;if(i.photo)photos++;
  return `<article class="card"><div class="ph${i.photo?"":" miss"}">${i.photo?`<img data-p="${i.photo}" alt="${esc(i.name)}">`:"照片待補"}</div><div class="pn">${esc(i.name)}</div><div class="inf">規格：${esc(i.spec||"—")}</div><div class="pr">${esc(i.price)}</div><div class="bc">條碼 ${esc(i.barcode||"—")}</div>${SO.length?`<div class="tags">${(i.st||[]).length?(i.st||[]).map(n=>`<span>${esc(n)}</span>`).join(""):`<span class="no">未列店別</span>`}</div>`:""}</article>`}).join("")+"</div>";
 main.insertBefore(s,$("#none"));
 v._el=s;v._cards=[...s.querySelectorAll(".card")];
 v._keys=v.items.map(i=>(i.name+" "+i.spec+" "+i.barcode+" "+i.sku).toLowerCase());
 v._vk=(v.code+" "+v.name).toLowerCase();
 const a=document.createElement("a");a.href="#v-"+v.code;a.innerHTML=`<b>${esc(v.code)}</b>${esc(v.name)}<i>${v.items.length}</i>`;v._em=s.querySelector("h2 em");v._ai=a.querySelector("i");v._st=v.items.map(i=>i.st||[]);
 a.onclick=()=>nav.classList.remove("open");v._a=a;nav.appendChild(a);
 return s;
});
function upd(){
 const q=$("#q").value.trim().toLowerCase();let shown=0,baseV=0,baseN=0;
 const all=STORE===ALL;document.body.classList.toggle("all",all);
 DATA.forEach(v=>{
  const vm=q&&v._vk.includes(q);let n=0,m=0;
  v._cards.forEach((c,k)=>{const inS=all||v._st[k].includes(STORE);if(inS)m++;const ok=inS&&(!q||vm||v._keys[k].includes(q));c.style.display=ok?"":"none";if(ok)n++});
  v._el.style.display=n?"":"none";v._a.style.display=n?"":"none";shown+=n;
  v._em.textContent=m+" 項";v._ai.textContent=m;if(m){baseV++;baseN+=m}
 });
 $("#none").style.display=shown?"none":"block";
 $("#cnt").textContent=(all?"":STORE+"・")+(q?`符合 ${shown} / `:"")+`${baseV} 家廠商・${baseN} 項商品`;
}
function syncQuizLinks(){
 const q=(STORE&&STORE!==ALL)?("?store="+encodeURIComponent(STORE)):"";
 document.querySelectorAll("#quizMenu a").forEach(a=>{
  const base=(a.getAttribute("href")||"").split("?")[0];
  if(/^(?:\.\/)?quiz/.test(base)) a.setAttribute("href", base+q);
 });
}
function setStore(n,save){
 STORE=SO.includes(n)?n:ALL;
 document.querySelectorAll("#stores button").forEach(b=>{const c=b.dataset.s===STORE;b.classList.toggle("cur",c);b.setAttribute("aria-selected",c)});
 if(save){try{localStorage.setItem(LS_STORE,STORE)}catch(e){}
  const u=new URL(location.href);if(STORE===ALL)u.searchParams.delete("store");else u.searchParams.set("store",STORE);history.replaceState(null,"",u.pathname+u.search+u.hash);}
 upd();
 syncQuizLinks();
}
let t;$("#q").addEventListener("input",()=>{clearTimeout(t);t=setTimeout(upd,120)});
$("#menuBtn").onclick=()=>nav.classList.toggle("open");
if(SO.length){
 const box=$("#stores");box.innerHTML=[ALL,...SO].map(n=>`<button type="button" role="tab" data-s="${esc(n)}">${esc(n)}</button>`).join("");box.classList.add("on");
 box.onclick=e=>{const b=e.target.closest("button");if(b){setStore(b.dataset.s,true);scrollTo(0,0)}};
 const urlS=new URLSearchParams(location.search).get("store");let saved=null;try{saved=localStorage.getItem(LS_STORE)}catch(e){}
 if(urlS&&(urlS===ALL||SO.includes(urlS)))setStore(urlS,true);         // ?store=<店名> 優先，並記住
 else if(saved&&(saved===ALL||SO.includes(saved)))setStore(saved,false); // 上次選的店
 else setStore(DEF,false);                                               // 預設（build_site.py 的 DEFAULT_STORE）
}else{STORE=ALL;upd();syncQuizLinks();}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);loadImg(e.target)}}),{rootMargin:"600px 0px"});
document.querySelectorAll("img[data-p]").forEach(im=>io.observe(im));
}

const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const LS="handbook_key_"+META.salt;
let KEY=null;
async function derive(pw,ext){
 const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:b64d(META.salt),iterations:META.iter},base,{name:"AES-GCM",length:256},ext,["decrypt"]);
}
async function dec(key,buf){const u=new Uint8Array(buf);return crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},key,u.slice(12));}
async function fetchBin(p,fresh){const r=await fetch(p,fresh?{cache:"reload"}:{});if(!r.ok)throw new Error("http "+r.status);return r.arrayBuffer();}
let dataBuf=null;
async function tryKey(key){
 if(!dataBuf)dataBuf=await fetchBin(META.data);
 let plain;try{plain=await dec(key,dataBuf)}catch(e){return false}
 DATA=JSON.parse(new TextDecoder().decode(plain));KEY=key;return true;
}
function unlock(){$("#lock").remove();$("#app").style.display="block";render();}
async function loadImg(im){
 for(let k=0;k<3;k++){
  try{const b=await dec(KEY,await fetchBin("p/"+im.dataset.p+".bin",k>0));
   im.src=URL.createObjectURL(new Blob([b],{type:"image/jpeg"}));return;}
  catch(e){await new Promise(r=>setTimeout(r,400*(k+1)))}
 }
 im.parentNode.classList.add("miss");im.replaceWith("照片載入失敗（網站剛更新，請重新整理頁面）");
}
async function submit(){
 const pw=$("#pw").value;if(!pw)return;
 $("#go").disabled=true;$("#err").textContent="解鎖中…";
 try{
  const rem=$("#rem").checked;const key=await derive(pw,rem);
  if(await tryKey(key)){
   if(rem){localStorage.setItem(LS,b64e(await crypto.subtle.exportKey("raw",key)))}
   unlock();
  }else{$("#err").textContent="密碼不對";$("#pw").select();}
 }catch(e){$("#err").textContent="載入失敗，請檢查網路後再試";}
 if($("#go"))$("#go").disabled=false;
}
$("#go").onclick=submit;
$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")submit()});
(async()=>{
 Object.keys(localStorage).filter(k=>k.startsWith("handbook_key_")&&k!==LS).forEach(k=>localStorage.removeItem(k));
 const s=localStorage.getItem(LS);
