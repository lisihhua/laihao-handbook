<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新人商品手冊｜來好</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:150px}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:#f6f1e8;color:#2a2420;line-height:1.5}
header{position:sticky;top:0;z-index:20;background:#7a2e2a;color:#fff;padding:10px 14px}
header h1{font-size:20px;letter-spacing:.12em;display:inline-block;margin-right:12px}
header .cnt{font-size:12px;opacity:.85}
#q{display:block;width:100%;max-width:560px;margin-top:8px;padding:10px 12px;font-size:16px;border:0;border-radius:8px}
#menuBtn{display:none;float:right;background:#fff2;color:#fff;border:1px solid #fff6;border-radius:6px;padding:4px 10px;font-size:14px}
.layout{display:flex;align-items:flex-start;max-width:1500px;margin:0 auto}
nav{position:sticky;top:96px;width:250px;flex:0 0 250px;max-height:calc(100vh - 106px);overflow:auto;padding:10px;background:#fffdf8;border-right:1px solid #e4d8c8;font-size:13px}
nav a{display:block;padding:5px 6px;color:#2a2420;text-decoration:none;border-radius:4px}
nav a:hover{background:#efe7db}
nav a b{color:#7a2e2a;font-weight:700;margin-right:6px}
nav a i{float:right;color:#8a7b6c;font-style:normal}
main{flex:1;padding:14px;min-width:0}
section.v{margin-bottom:28px}
section.v h2{font-size:20px;border-bottom:2px solid #7a2e2a;padding-bottom:4px;margin-bottom:10px;font-family:serif}
section.v h2 small{font-size:13px;color:#7a2e2a;margin-right:8px;font-family:sans-serif}
section.v h2 em{font-size:12px;color:#8a7b6c;font-style:normal;margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:#fffdf8;border:1px solid #e4d8c8;border-radius:8px;padding:8px;display:flex;flex-direction:column}
.ph{aspect-ratio:1/1;background:#111;border-radius:5px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.ph img{width:100%;height:100%;object-fit:contain}
.ph.miss{background:repeating-linear-gradient(-45deg,#efe7db,#efe7db 10px,#e7ddd0 10px,#e7ddd0 20px);color:#8a7b6c;letter-spacing:.12em;font-size:14px}
.pn{font-weight:700;font-size:14px;line-height:1.35;min-height:2.7em}
.inf{font-size:12px;color:#5c564f;margin-top:4px}
.pr{margin-top:auto;padding-top:4px;font-size:18px;font-weight:700;color:#7a2e2a}
.bc{font-size:11px;color:#8a7b6c;word-break:break-all}
#none{display:none;padding:40px;text-align:center;color:#8a7b6c}
footer{padding:16px;text-align:center;font-size:12px;color:#8a7b6c}
#top{position:fixed;right:14px;bottom:14px;background:#7a2e2a;color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:18px;cursor:pointer}
@media(max-width:800px){
 #menuBtn{display:block}
 nav{display:none;position:fixed;top:0;left:0;bottom:0;width:80%;max-width:320px;max-height:none;z-index:30;box-shadow:2px 0 12px #0006;padding-top:16px}
 nav.open{display:block}
 html{scroll-padding-top:110px}
 .grid{grid-template-columns:repeat(2,1fr);gap:8px}
 main{padding:8px}
}
#lock{position:fixed;inset:0;z-index:100;background:#f6f1e8;display:flex;align-items:center;justify-content:center;padding:20px}
#lock .box{background:#fffdf8;border:1px solid #e4d8c8;border-radius:12px;padding:28px 24px;width:100%;max-width:360px;box-shadow:0 4px 18px #0001;text-align:center}
#lock h1{font-size:24px;letter-spacing:.15em;color:#7a2e2a;margin-bottom:18px;font-family:serif}
#pw{width:100%;padding:12px;font-size:16px;border:1px solid #cdbfae;border-radius:8px;margin-bottom:10px}
#lock label{display:block;text-align:left;font-size:14px;color:#5c564f;margin-bottom:14px}
#go{width:100%;padding:12px;font-size:16px;background:#7a2e2a;color:#fff;border:0;border-radius:8px;cursor:pointer}
#go:disabled{opacity:.6}
#err{color:#b3261e;font-size:14px;min-height:1.4em;margin-top:10px}
#app{display:none}
</style>
</head>
<body>
<div id="lock"><div class="box"><h1>新人商品手冊</h1>
<input id="pw" type="password" placeholder="請輸入密碼" autocomplete="current-password">
<label><input id="rem" type="checkbox"> 記住密碼</label>
<button id="go" type="button">進入</button>
<div id="err"></div></div></div>
<div id="app">
<header>
 <button id="menuBtn">廠商目錄</button>
 <h1>新人商品手冊</h1><span class="cnt" id="cnt"></span>
 <input id="q" type="search" placeholder="搜尋品名、廠商名、廠商代號、條碼" autocomplete="off">
</header>
<div class="layout">
 <nav id="nav"></nav>
 <main id="main"><div id="none">找不到符合的商品</div></main>
</div>
<footer>售價為商品資料清冊含稅定價，實際售價以門市系統為準。商品照片取自網路公開來源，僅供辨識。</footer>
<button id="top" onclick="scrollTo(0,0)">↑</button>
</div>
<script>
const META={"salt": "ZyZDvGjNkWJiiW+gZAQ80w==", "iter": 310000, "data": "d246c4d84b9d7.bin"};
let DATA=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const main=$("#main"),nav=$("#nav");
let total=0,photos=0;
function render(){
const secs=DATA.map(v=>{
 const s=document.createElement("section");s.className="v";s.id="v-"+v.code;
 s.innerHTML=`<h2><small>${esc(v.code)}</small>${esc(v.name)}<em>${v.items.length} 項</em></h2><div class="grid">`+
 v.items.map(i=>{total++;if(i.photo)photos++;
  return `<article class="card"><div class="ph${i.photo?"":" miss"}">${i.photo?`<img data-p="${i.photo}" alt="${esc(i.name)}">`:"照片待補"}</div><div class="pn">${esc(i.name)}</div><div class="inf">規格：${esc(i.spec||"—")}</div><div class="pr">${esc(i.price)}</div><div class="bc">條碼 ${esc(i.barcode||"—")}</div></article>`}).join("")+"</div>";
 main.insertBefore(s,$("#none"));
 v._el=s;v._cards=[...s.querySelectorAll(".card")];
 v._keys=v.items.map(i=>(i.name+" "+i.spec+" "+i.barcode+" "+i.sku).toLowerCase());
 v._vk=(v.code+" "+v.name).toLowerCase();
 const a=document.createElement("a");a.href="#v-"+v.code;a.innerHTML=`<b>${esc(v.code)}</b>${esc(v.name)}<i>${v.items.length}</i>`;
 a.onclick=()=>nav.classList.remove("open");v._a=a;nav.appendChild(a);
 return s;
});
function upd(){
 const q=$("#q").value.trim().toLowerCase();let shown=0;
 DATA.forEach(v=>{
  const vm=q&&v._vk.includes(q);let n=0;
  v._cards.forEach((c,k)=>{const ok=!q||vm||v._keys[k].includes(q);c.style.display=ok?"":"none";if(ok)n++});
  v._el.style.display=n?"":"none";v._a.style.display=n?"":"none";shown+=n;
 });
 $("#none").style.display=shown?"none":"block";
 $("#cnt").textContent=(q?`符合 ${shown} / `:"")+`${DATA.length} 家廠商・${total} 項商品`;
}
let t;$("#q").addEventListener("input",()=>{clearTimeout(t);t=setTimeout(upd,120)});
$("#menuBtn").onclick=()=>nav.classList.toggle("open");
upd();
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);loadImg(e.target)}}),{rootMargin:"600px 0px"});
document.querySelectorAll("img[data-p]").forEach(im=>io.observe(im));
}

const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const LS="handbook_key_"+META.salt;
let KEY=null;
async function derive(pw,ext){
 const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:b64d(META.salt),iterations:META.iter},base,{name:"AES-GCM",length:256},ext,["decrypt"]);
}
async function dec(key,buf){const u=new Uint8Array(buf);return crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},key,u.slice(12));}
async function fetchBin(p,fresh){const r=await fetch(p,fresh?{cache:"reload"}:{});if(!r.ok)throw new Error("http "+r.status);return r.arrayBuffer();}
let dataBuf=null;
async function tryKey(key){
 if(!dataBuf)dataBuf=await fetchBin(META.data);
 let plain;try{plain=await dec(key,dataBuf)}catch(e){return false}
 DATA=JSON.parse(new TextDecoder().decode(plain));KEY=key;return true;
}
function unlock(){$("#lock").remove();$("#app").style.display="block";render();}
async function loadImg(im){
 for(let k=0;k<3;k++){
  try{const b=await dec(KEY,await fetchBin("p/"+im.dataset.p+".bin",k>0));
   im.src=URL.createObjectURL(new Blob([b],{type:"image/jpeg"}));return;}
  catch(e){await new Promise(r=>setTimeout(r,400*(k+1)))}
 }
 im.parentNode.classList.add("miss");im.replaceWith("照片載入失敗（網站剛更新，請重新整理頁面）");
}
async function submit(){
 const pw=$("#pw").value;if(!pw)return;
 $("#go").disabled=true;$("#err").textContent="解鎖中…";
 try{
  const rem=$("#rem").checked;const key=await derive(pw,rem);
  if(await tryKey(key)){
   if(rem){localStorage.setItem(LS,b64e(await crypto.subtle.exportKey("raw",key)))}
   unlock();
  }else{$("#err").textContent="密碼不對";$("#pw").select();}
 }catch(e){$("#err").textContent="載入失敗，請檢查網路後再試";}
 $("#go").disabled=false;
}
$("#go").onclick=submit;
$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")submit()});
(async()=>{
 Object.keys(localStorage).filter(k=>k.startsWith("handbook_key_")&&k!==LS).forEach(k=>localStorage.removeItem(k));
 const s=localStorage.getItem(LS);
 if(s){try{const k=await crypto.subtle.importKey("raw",b64d(s),"AES-GCM",false,["decrypt"]);
  if(await tryKey(k)){unlock();return}}catch(e){}
  localStorage.removeItem(LS);}
 $("#pw").focus();
})();
</script>
</body>
</html>
