<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>來好｜每月門市考試</title>
<style>
:root{--red:#EC715E;--blue:#30B0E6;--gold:#F8BF85;--green:#3BAA6B;--line:#ccc;--txt:#515856;--sub:#666;--soft:#f7f7f7;
--sans:-apple-system,"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff;color:var(--txt)}
body{font-family:var(--sans);font-size:16px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}button{cursor:pointer}
.hidden{display:none!important}
.logo{display:block;height:34px;width:auto}
.brandbar{display:flex;height:4px}.brandbar i{flex:1;display:block}
.brandbar i:nth-child(1){background:var(--red)}.brandbar i:nth-child(2){background:var(--blue)}.brandbar i:nth-child(3){background:var(--gold)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{padding-top:14px}header.top .wrap{padding-bottom:12px}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.back{border:1px solid var(--line);background:#fff;color:var(--txt);border-radius:6px;font-size:14px;font-weight:700;padding:0 12px;height:36px;line-height:34px;text-decoration:none;white-space:nowrap}
header h1{font-size:20px;font-weight:700;line-height:1.3;margin-top:10px}
.sub{font-size:13px;color:var(--sub);margin-top:4px}
main.app{max-width:720px;margin:0 auto;padding:16px 16px 32px}
.due{border:1px solid #f3d3b0;background:#fff8f0;border-radius:10px;padding:12px 14px;font-size:15px;margin-bottom:14px}
.due b{color:#c4513f}.due.late{border-color:#f0b4aa;background:#fff3f1}
.demo{border:1px dashed var(--red);color:#c4513f;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:14px}
.lbl{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:6px}
.stores{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.stores button{flex:1;min-width:84px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 8px;font-size:16px;font-weight:700;color:var(--txt)}
.stores button.cur{background:var(--txt);border-color:var(--txt);color:#fff}
.need{font-size:13px;color:#c4513f;min-height:20px;margin-bottom:8px}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:18px 16px;margin-bottom:12px;font-size:18px;font-weight:700;color:var(--txt)}
.big .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.big small{display:block;font-size:13px;font-weight:400;color:var(--sub);margin-top:2px}
.big .ar{margin-left:auto;color:#aaa;font-size:20px}
.big.go{background:var(--red);border-color:var(--red);color:#fff}.big.go small{color:#fff;opacity:.9}.big.go .ar{color:#fff}
.b1 .ic{background:#e6f6fd}.b2 .ic{background:#fdeeea}.b3 .ic{background:#fef4e8}.big.go .ic{background:#ffffff33}
.big[disabled]{opacity:.45;cursor:default}
.vh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.vh h2{font-size:19px;flex:1}
.ghost{border:1px solid var(--line);background:#fff;color:var(--txt);border-radius:8px;padding:8px 14px;font-size:14px;font-weight:700}
.row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.row .n{font-weight:700;width:26px;text-align:right;flex:none}
.row img{width:60px;height:60px;object-fit:contain;border:1px solid #eee;border-radius:6px;flex:none;background:#fff}
.row .tx{flex:1;min-width:0}.row .tx b{display:block;font-size:15px;line-height:1.35}.row .tx span{font-size:12px;color:var(--sub)}
.row .pr{font-size:17px;font-weight:700;color:#c4513f;flex:none;white-space:nowrap}
.act{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.act h3{font-size:17px;line-height:1.4}.act .pd{font-size:13px;color:var(--sub);margin-top:2px}
.act .ds{white-space:pre-wrap;margin-top:8px;font-size:15px}
.empty{color:var(--sub);text-align:center;padding:30px 0}
.card{border:1px solid var(--line);border-radius:12px;padding:18px}
.card input,.card select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;font-size:17px;margin:6px 0 4px;background:#fff}
.card .rule{font-size:14px;color:var(--sub);margin:12px 0 16px;line-height:1.7}
.pri{width:100%;border:0;border-radius:10px;background:var(--red);color:#fff;font-size:17px;font-weight:700;padding:14px}
.pri[disabled]{opacity:.5}
/* exam */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:8px;font-size:14px;color:var(--sub)}
.qtop b{color:var(--txt);font-size:18px}
.clock{margin-left:auto;font-size:26px;font-weight:800;color:var(--txt);min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.clock.warn{color:#d23c25}
.tbar{height:8px;border-radius:4px;background:#eee;overflow:hidden;margin-bottom:14px}.tbar i{display:block;height:100%;background:var(--blue);width:100%}
.tbar.warn i{background:#d23c25}
.qtag{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:2px 10px;background:#eef7fc;color:#1f7fa8;margin-bottom:8px}
.qtag.t1{background:#fdeeea;color:#b4473a}.qtag.t2{background:#fef4e8;color:#a3661c}
.qimg{height:min(30vh,240px);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.qimg img{max-width:100%;max-height:100%;object-fit:contain}
.qtext{font-size:19px;font-weight:700;line-height:1.45;margin-bottom:4px}
.qsub{font-size:13px;color:var(--sub);margin-bottom:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opts.txt{grid-template-columns:1fr}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:15px 10px;font-size:18px;font-weight:700;color:var(--txt);min-height:58px;line-height:1.35}
.opts.txt .opt{text-align:left;font-size:16px;padding:13px 14px}
.opt.ok{border-color:var(--green);background:#eaf7ef;color:#1f7a47}
.opt.bad{border-color:#d23c25;background:#fdecea;color:#b1301d}
.opt[disabled]{cursor:default}
.flash{text-align:center;font-weight:800;font-size:17px;min-height:28px;margin-top:10px}
.flash.ok{color:#1f7a47}.flash.bad{color:#b1301d}
.loading{text-align:center;padding:60px 0;color:var(--sub)}
/* result */
.score{text-align:center;padding:10px 0 16px}
.score .big2{font-size:52px;font-weight:800;line-height:1.1}.score .big2 small{font-size:22px;color:var(--sub)}
.score .who{font-size:15px;color:var(--sub);margin-top:6px}
.send{font-size:13px;text-align:center;margin-bottom:14px;color:var(--sub)}
.rv{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px}
.rv .mk{font-size:18px;font-weight:800;flex:none;width:22px}.rv.ok .mk{color:var(--green)}.rv.bad .mk{color:#d23c25}
.rv .tx{flex:1;min-width:0;font-size:14px}.rv .tx b{display:block;font-size:15px;line-height:1.4}
.rv .tx .ca{color:#1f7a47;font-weight:700}.rv .tx .ya{color:#b1301d}
.btns{display:flex;gap:10px;margin-top:16px}.btns>*{flex:1}
.rtbox{margin-top:16px;border-radius:12px;padding:14px;text-align:center}
.rtbox.more{border:1px solid #f0b4aa;background:#fff3f1}.rtbox.done{border:1px solid #bfe3cd;background:#eaf7ef}
.rtbox .rtmsg{font-size:15px;margin-bottom:10px}.rtbox.done .rtmsg{font-size:18px;font-weight:800;color:#1f7a47;margin-bottom:0}
.rtbtn{width:100%;border:0;border-radius:10px;background:var(--red);color:#fff;font-size:17px;font-weight:700;padding:14px}
.rtbanner{display:inline-block;font-size:13px;font-weight:700;border-radius:20px;padding:3px 12px;background:#fff3f1;color:#c4513f;border:1px solid #f0b4aa;margin-bottom:8px}
footer.ft{text-align:center;color:var(--sub);font-size:12px;padding:0 0 22px}
/* lock */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lockcard{width:100%;max-width:380px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lockcard .in{padding:26px 24px 24px}
.lockcard h1{font-size:20px;font-weight:700;margin-top:18px;line-height:1.3}
.lockcard .sub{margin:4px 0 20px}
.lockcard input[type=password]{width:100%;padding:13px 14px;border-radius:8px;border:1px solid var(--line);font-size:16px}
.rem{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);margin:12px 0 16px}
.go1{width:100%;padding:13px;border:0;border-radius:8px;background:var(--txt);color:#fff;font-size:16px;font-weight:700}
.err{min-height:20px;margin-top:8px;font-size:13px;color:#c4513f}.go1:disabled{opacity:.6}
@media(max-width:400px){.opt{font-size:17px;padding:13px 6px}.big{font-size:17px;padding:16px 14px}}
</style>
</head>
<body>
<section id="lock">
 <div class="lockcard">
  <div class="brandbar"><i></i><i></i><i></i></div>
  <div class="in">
   <img class="logo" alt="來好 LAI HAO">
   <h1>每月門市考試</h1>
   <div class="sub">前 50 名商品價格＋當月活動，請輸入密碼進入</div>
   <input type="password" id="pw" placeholder="輸入密碼" autocomplete="current-password"><div id="err" class="err"></div>
   <label class="rem"><input type="checkbox" id="rem" checked> 記住密碼</label>
   <button class="go1" id="go">進入</button>
  </div>
 </div>
</section>
<div id="app" class="hidden">
 <header class="top">
  <div class="wrap">
   <div class="hbar"><img class="logo" alt="來好 LAI HAO"><a class="back" href="../" id="backHb">← 新人商品手冊</a></div>
   <h1 id="title">每月門市考試</h1>
   <div class="sub" id="subtitle"></div>
  </div>
  <div class="brandbar"><i></i><i></i><i></i></div>
 </header>
 <main class="app">
  <!-- 複習首頁 -->
  <section id="vHome">
   <div class="due" id="due"></div>
   <div class="demo hidden" id="demo">目前活動內容是範例，正式內容待更新。</div>
   <div class="lbl">選擇門市</div>
   <div class="stores" id="stores" role="tablist" aria-label="門市"></div>
   <div class="need" id="need"></div>
   <button class="big b1" data-v="vTop"><span class="ic">🏆</span><span>前50名商品<small id="topHint">熱銷商品與售價</small></span><span class="ar">›</span></button>
   <button class="big b2" data-v="vPromo"><span class="ic">🏷️</span><span>當月促銷活動<small id="promoHint"></small></span><span class="ar">›</span></button>
   <button class="big b3" data-v="vMkt"><span class="ic">📣</span><span>當月行銷活動<small id="mktHint"></small></span><span class="ar">›</span></button>
   <button class="big go" data-v="vName"><span class="ic">✍️</span><span>我準備好要考試了！<small id="goHint"></small></span><span class="ar">›</span></button>
  </section>
  <!-- 前 50 名 -->
  <section id="vTop" class="hidden">
   <div class="vh"><button class="ghost" data-home>‹ 返回</button><h2 id="topTitle">前50名商品</h2></div>
   <div id="topRows"></div>
  </section>
  <section id="vPromo" class="hidden">
   <div class="vh"><button class="ghost" data-home>‹ 返回</button><h2>當月促銷活動</h2></div>
   <div id="promoRows"></div>
  </section>
  <section id="vMkt" class="hidden">
   <div class="vh"><button class="ghost" data-home>‹ 返回</button><h2>當月行銷活動</h2></div>
   <div id="mktRows"></div>
  </section>
  <!-- 填姓名 -->
  <section id="vName" class="hidden">
   <div class="vh"><button class="ghost" data-home>‹ 返回</button><h2>開始考試</h2></div>
   <div class="card">
    <div class="lbl">門市</div><div id="nameStore" style="font-size:18px;font-weight:700;margin-bottom:12px"></div>
    <label class="lbl" for="empSelect">你的姓名</label>
    <select id="empSelect" aria-label="選擇姓名"><option value="">請選擇姓名</option></select>
    <input id="empName" class="hidden" maxlength="20" placeholder="請輸入姓名" autocomplete="name">
    <div class="need" id="nameErr"></div>
    <div class="rule" id="rule"></div>
    <button class="pri" id="startBtn">開始考試</button>
   </div>
  </section>
  <!-- 考試 -->
  <section id="vExam" class="hidden">
   <div id="examLoading" class="loading">題目準備中…</div>
   <div id="examBody" class="hidden">
    <div class="rtbanner hidden" id="rtBanner"></div>
    <div class="qtop"><span>第 <b id="qNo">1</b> / <span id="qTot">15</span> 題</span><span class="clock" id="clock">10</span></div>
    <div class="tbar" id="tbar"><i id="tfill"></i></div>
    <span class="qtag" id="qTag"></span>
    <div class="qimg" id="qImgBox"><img id="qImg" alt="題目商品圖片"></div>
    <div class="qtext" id="qText"></div>
    <div class="qsub" id="qSub"></div>
    <div class="opts" id="opts"></div>
    <div class="flash" id="flash"></div>
   </div>
  </section>
  <!-- 成績 -->
  <section id="vResult" class="hidden">
   <div class="score"><div class="big2" id="scoreNum"></div><div class="who" id="scoreWho"></div></div>
   <div class="send" id="sendState"></div>
   <div class="lbl">答案對照</div>
   <div id="review"></div>
   <div class="rtbox hidden" id="rtBox"><div class="rtmsg" id="rtMsg"></div><button class="rtbtn hidden" id="rtBtn">錯題重考</button></div>
   <div class="btns"><button class="ghost" data-home>回複習頁</button><button class="ghost" id="againBtn">再考一次</button></div>
  </section>
 </main>
 <footer class="ft">來好 LAI HAO｜內部教育訓練使用</footer>
</div>

const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS="handbook_key_"+META.salt, LS_STORE="handbook_store", LS_NAME="monthly_exam_name", LS_PEND="monthly_exam_pending";
let KEY=null,P=null,dataBuf=null,STORE=null;
async function derive(pw,ext){
 const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:b64d(META.salt),iterations:META.iter},base,{name:"AES-GCM",length:256},ext,["decrypt"]);
}
async function dec(key,buf){const u=new Uint8Array(buf);return crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},key,u.slice(12));}
async function fetchBin(p,fresh){const r=await fetch(p,fresh?{cache:"reload"}:{});if(!r.ok)throw new Error("http "+r.status);return r.arrayBuffer();}
async function tryKey(key){
 if(!dataBuf)dataBuf=await fetchBin(META.data);
 let plain;try{plain=await dec(key,dataBuf)}catch(e){return false}
 P=JSON.parse(new TextDecoder().decode(plain));KEY=key;return true;
}
const imgCache=new Map();
function getImg(id){
 if(!imgCache.has(id)){
  imgCache.set(id,(async()=>{
   for(let k=0;k<3;k++){
    try{const b=await dec(KEY,await fetchBin("p/"+id+".bin",k>0));return URL.createObjectURL(new Blob([b],{type:"image/jpeg"}))}
    catch(e){await new Promise(r=>setTimeout(r,400*(k+1)))}
   }
   imgCache.delete(id);throw new Error("img");
  })());
 }
 return imgCache.get(id);
}
/* ---------- 成績送出（submit_url 由 monthly_exam/config.json 設定；空白時不送） ---------- */
async function postScore(rec){
 const url=P.submit_url;
 if(!url)return "off";
 try{
  // text/plain + no-cors：Apps Script 網頁應用程式可用 e.postData.contents 讀到 JSON，且不觸發 CORS 預檢
  await fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(rec),keepalive:true});
  return "sent";
 }catch(e){
  try{const q=JSON.parse(localStorage.getItem(LS_PEND)||"[]");q.push(rec);localStorage.setItem(LS_PEND,JSON.stringify(q.slice(-20)))}catch(_){}
  return "queued";
 }
}
async function flushPending(){
 if(!P.submit_url)return;
 let q=[];try{q=JSON.parse(localStorage.getItem(LS_PEND)||"[]")}catch(e){}
 if(!q.length)return;
 localStorage.removeItem(LS_PEND);
 for(const r of q)await postScore(r);
}

const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function priceStep(p){return p<100?10:p<300?20:p<1000?50:100}
function distractors(p,others){
 // 合理的干擾價格：同尾數、同級距（±1~3 個級距），再混入同店前 50 名裡價位相近、同尾數的真實售價
 const st=priceStep(p),c=new Set();
 const lo0=Math.max(p*0.5,p-3*st),hi0=Math.min(p*1.7,p+3*st);
 for(const k of [-3,-2,-1,1,2,3]){const v=p+k*st;if(v>0&&v>=lo0&&v<=hi0)c.add(v)}
 for(const o of others){if(o&&o!==p&&o%10===p%10&&o>=lo0&&o<=hi0)c.add(o)}
 c.delete(p);
 for(let k=1;c.size<3&&k<20;k++){const v=p+k*st;if(v!==p)c.add(v)}
 let arr=shuffle([...c]);
 // 避免三個都比正確答案高（或都低），讓正確答案落在中間、兩端的機會都有
 const lo=arr.filter(v=>v<p),hi=arr.filter(v=>v>p),want=rnd(4); // 0..3 個比正確答案低
 let pick=[...lo.slice(0,want),...hi.slice(0,3-want)];
 for(const v of arr){if(pick.length>=3)break;if(!pick.includes(v))pick.push(v)}
 return pick.slice(0,3);
}
function makeExam(){
 const D=P.stores[STORE],priced=D.filter(x=>x.pv);
 const pool=shuffle(P.pool||[]);
 const nPool=Math.min(P.pool_q,pool.length),nPrice=P.price_q+(P.pool_q-nPool);
 const allP=priced.map(x=>x.pv);
 const qs=shuffle(priced).slice(0,nPrice).map(x=>{
  const opts=shuffle([x.pv,...distractors(x.pv,allP)]);
  return {type:"price",tag:"商品售價",q:"這個商品售價多少？",sub:x.n+"｜"+x.v,img:x.a,o:opts.map(v=>"$"+v.toLocaleString()),ans:opts.indexOf(x.pv),rank:x.r};
 });
 const ps=pool.slice(0,nPool).map(q=>{
  const order=shuffle([0,1,2,3]);
  return {type:q.src,tag:q.src+"活動",q:q.q,sub:q.t,o:order.map(i=>q.o[i]),ans:order.indexOf(q.ans)};
 });
 return shuffle([...qs,...ps]);
}
const OTHER="其他（手動輸入）";
function staffOf(store){return (P.staff&&P.staff[store])||[]}
function fillNameForm(){
 $("#nameStore").textContent=STORE;$("#nameErr").textContent="";
 const list=staffOf(STORE);
 let saved="";try{saved=localStorage.getItem(LS_NAME)||""}catch(e){}
 $("#empSelect").innerHTML='<option value="">請選擇姓名</option>'+list.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join("")+'<option value="__other__">'+OTHER+'</option>';
 if(saved&&list.includes(saved)){$("#empSelect").value=saved;$("#empName").value=""}
 else if(saved){$("#empSelect").value="__other__";$("#empName").value=saved}
 else{$("#empSelect").value="";$("#empName").value=""}
 toggleOther();
 $("#rule").innerHTML="・共 "+(P.price_q+P.pool_q)+" 題選擇題："+P.price_q+" 題商品售價、"+P.pool_q+" 題當月活動<br>・每題限時 "+P.seconds+" 秒，時間到算答錯並自動跳下一題<br>・考完會顯示分數與正確答案，答錯的題目可按「錯題重考」再練習"+(P.submit_url?"，成績會送給主管":"");
}
function toggleOther(){
 const o=$("#empSelect").value==="__other__";
 $("#empName").classList.toggle("hidden",!o);
 if(o)$("#empName").focus();
}
function chosenName(){
 const v=$("#empSelect").value;
 if(!v)return "";
 if(v==="__other__")return $("#empName").value.trim();
 return v;
}
let EXAM=[],cur=0,ans=[],timer=null,tEnd=0,locked=false,startedAt=null,EMP_NAME="";
let RETAKE=false,RT_ROUND=0,MAIN_ATTEMPT=1,WRONGQ=[];
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
async function startExam(){
 const name=chosenName();
 if(!$("#empSelect").value){$("#nameErr").textContent="請選擇姓名";$("#empSelect").focus();return}
 if(!name){$("#nameErr").textContent="請輸入姓名";$("#empName").focus();return}
 try{localStorage.setItem(LS_NAME,name)}catch(e){}
 EMP_NAME=name;
 EXAM=makeExam();EXAM.forEach((q,i)=>q.no0=i+1);cur=0;ans=[];startedAt=new Date();
 RETAKE=false;RT_ROUND=0;WRONGQ=[];$("#rtBanner").classList.add("hidden");
 show("vExam");$("#examLoading").classList.remove("hidden");$("#examBody").classList.add("hidden");
 $("#examLoading").textContent="題目準備中…";
 // 先把所有題目圖片載好，計時才公平
 await Promise.all(EXAM.filter(q=>q.img).map(q=>getImg(q.img).catch(()=>null)));
 $("#examLoading").classList.add("hidden");$("#examBody").classList.remove("hidden");
 $("#qTot").textContent=EXAM.length;
 showQ();
}
$("#startBtn").onclick=startExam;
$("#empSelect").addEventListener("change",toggleOther);
$("#empName").addEventListener("keydown",e=>{if(e.key==="Enter")startExam()});
async function showQ(){
 const q=EXAM[cur];locked=false;
 $("#qNo").textContent=cur+1;
 $("#qTag").textContent=q.tag;$("#qTag").className="qtag"+(q.type==="促銷"?" t1":q.type==="行銷"?" t2":"");
 $("#qText").textContent=q.q;$("#qSub").textContent=q.sub||"";
 $("#flash").textContent="";$("#flash").className="flash";
 const box=$("#qImgBox"),im=$("#qImg");
 if(q.img){box.classList.remove("hidden");im.removeAttribute("src");try{im.src=await getImg(q.img)}catch(e){im.alt="照片載入失敗"}}
 else box.classList.add("hidden");
 $("#opts").className="opts"+(q.type==="price"?"":" txt");
 $("#opts").innerHTML=q.o.map((t,i)=>'<button class="opt" data-i="'+i+'">'+esc(t)+'</button>').join("");
 document.querySelectorAll("#opts .opt").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
 const ms=P.seconds*1000;tEnd=Date.now()+ms;q.t0=Date.now();
 stopTimer();tick();timer=setInterval(tick,100);
}
function tick(){
 const left=Math.max(0,tEnd-Date.now()),ms=P.seconds*1000;
 const s=Math.ceil(left/1000);
 $("#clock").textContent=s;$("#tfill").style.width=(left/ms*100)+"%";
 const w=left<=(P.warn||5)*1000;$("#clock").classList.toggle("warn",w);$("#tbar").classList.toggle("warn",w);
 if(left<=0)choose(-1);
}
function choose(i){
 if(locked)return;locked=true;stopTimer();
 const q=EXAM[cur],ok=i===q.ans;
 ans.push({no:q.no0||cur+1,type:q.type==="price"?"價格":q.type,question:q.q+(q.type==="price"?"（"+q.sub+"）":""),
  choice:i>=0?q.o[i]:null,correct:q.o[q.ans],ok,timeout:i<0,ms:Date.now()-q.t0});
 document.querySelectorAll("#opts .opt").forEach((b,k)=>{b.disabled=true;if(k===q.ans)b.classList.add("ok");else if(k===i)b.classList.add("bad")});
 $("#flash").className="flash "+(ok?"ok":"bad");
 $("#flash").textContent=i<0?"⏰ 時間到！":ok?"✓ 答對了":"✗ 答錯了";
 setTimeout(()=>{cur++;if(cur<EXAM.length)showQ();else if(RETAKE)finishRetake();else finish()},i<0?1300:900);
}
function reviewHtml(list){
 return list.map(a=>'<div class="rv '+(a.ok?"ok":"bad")+'"><span class="mk">'+(a.ok?"✓":"✗")+'</span><div class="tx"><b>'+a.no+'. '+esc(a.question)+'</b>正確答案：<span class="ca">'+esc(a.correct)+'</span>'+(a.ok?'':'<br>你的答案：<span class="ya">'+(a.timeout?"時間到未作答":esc(a.choice))+'</span>')+'</div></div>').join("");
}
async function finish(){
 const score=ans.filter(a=>a.ok).length,total=EXAM.length,name=EMP_NAME;
 const akey="monthly_exam_attempt_"+P.exam_month+"_"+STORE+"_"+name;let attempt=1;
 try{attempt=(+localStorage.getItem(akey)||0)+1;localStorage.setItem(akey,attempt)}catch(e){}
 MAIN_ATTEMPT=attempt;
 $("#scoreNum").innerHTML=score+"<small> / "+total+"</small>";
 $("#scoreWho").textContent=STORE+"・"+name+"・"+P.exam_label+"（第 "+attempt+" 次）";
 $("#review").innerHTML=reviewHtml(ans);
 WRONGQ=EXAM.filter((q,i)=>ans[i]&&!ans[i].ok);
 renderRetakeBox();
 show("vResult");
 const rec={month:P.exam_month,store:STORE,name,score,total,answers:ans,timestamp:new Date().toISOString(),timestamp_taipei:new Date().toLocaleString("zh-TW",{timeZone:"Asia/Taipei",hour12:false}),
  attempt,started_at:startedAt.toISOString(),deadline:P.deadline,
  store_total:staffOf(STORE).length,store_staff:staffOf(STORE)};
 $("#sendState").textContent=P.submit_url?"成績送出中…":"";
 const st=await postScore(rec);
 $("#sendState").textContent=st==="sent"?"✓ 成績已送出給主管":st==="queued"?"網路不穩，成績先存在這支手機，下次開啟會自動補送":"";
}
/* ---------- 錯題重考 ---------- */
function renderRetakeBox(){
 const box=$("#rtBox"),btn=$("#rtBtn");
 if(RETAKE&&!WRONGQ.length){
  box.className="rtbox done";$("#rtMsg").textContent="🎉 恭喜！錯題全部答對了";btn.classList.add("hidden");
 }else if(WRONGQ.length){
  box.className="rtbox more";btn.classList.remove("hidden");
  $("#rtMsg").textContent="還有 "+WRONGQ.length+" 題答錯（含時間到），再練習一次吧";
  btn.textContent="錯題重考（"+WRONGQ.length+" 題）";
 }else{box.className="rtbox hidden";btn.classList.add("hidden")}
}
function retakeSet(list){
 // 同題目、同選項，只重新洗牌選項順序
 return list.map(q=>{const order=shuffle(q.o.map((_,i)=>i));return Object.assign({},q,{o:order.map(i=>q.o[i]),ans:order.indexOf(q.ans)})});
}
async function startRetake(){
 if(!WRONGQ.length)return;
 RETAKE=true;RT_ROUND++;
 EXAM=retakeSet(WRONGQ);cur=0;ans=[];startedAt=new Date();
 $("#rtBanner").textContent="錯題重考・第 "+RT_ROUND+" 次重考";$("#rtBanner").classList.remove("hidden");
 show("vExam");$("#examLoading").classList.remove("hidden");$("#examBody").classList.add("hidden");
 $("#examLoading").textContent="題目準備中…";
 await Promise.all(EXAM.filter(q=>q.img).map(q=>getImg(q.img).catch(()=>null)));
 $("#examLoading").classList.add("hidden");$("#examBody").classList.remove("hidden");
 $("#qTot").textContent=EXAM.length;
 showQ();
}
async function finishRetake(){
 const score=ans.filter(a=>a.ok).length,total=EXAM.length,name=EMP_NAME;
 $("#scoreNum").innerHTML=score+"<small> / "+total+" 題答對</small>";
 $("#scoreWho").textContent=STORE+"・"+name+"・錯題重考（第 "+RT_ROUND+" 次重考）";
 $("#review").innerHTML=reviewHtml(ans);
 WRONGQ=EXAM.filter((q,i)=>ans[i]&&!ans[i].ok);
 renderRetakeBox();
 show("vResult");
 // 重考成績同樣送到 submit_url；新增欄位 kind／retake_round，attempt 維持正式考試的第幾次（重考不增加）
 const rec={month:P.exam_month,store:STORE,name,score,total,answers:ans,timestamp:new Date().toISOString(),timestamp_taipei:new Date().toLocaleString("zh-TW",{timeZone:"Asia/Taipei",hour12:false}),
  attempt:MAIN_ATTEMPT,kind:"retake",retake_round:RT_ROUND,started_at:startedAt.toISOString(),deadline:P.deadline,
  store_total:staffOf(STORE).length,store_staff:staffOf(STORE)};
 $("#sendState").textContent=P.submit_url?"成績送出中…":"";
 const st=await postScore(rec);
 $("#sendState").textContent=st==="sent"?"✓ 重考成績已送出給主管":st==="queued"?"網路不穩，成績先存在這支手機，下次開啟會自動補送":"";
}
$("#rtBtn").onclick=startRetake;
$("#againBtn").onclick=()=>{RETAKE=false;fillNameForm();show("vName")};
/* ---------- 解鎖 ---------- */
function unlock(){$("#lock").remove();$("#app").classList.remove("hidden");initHome()}
async function submit(){
 const pw=$("#pw").value;if(!pw)return;
 $("#go").disabled=true;$("#err").textContent="解鎖中…";
 try{
  const rem=$("#rem").checked;const key=await derive(pw,rem);
  if(await tryKey(key)){if(rem){localStorage.setItem(LS,b64e(await crypto.subtle.exportKey("raw",key)))}unlock();return}
  else{$("#err").textContent="密碼不對";$("#pw").select()}
 }catch(e){$("#err").textContent="載入失敗，請檢查網路後再試"}
 $("#go").disabled=false;
}
$("#go").onclick=submit;
$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")submit()});
(async()=>{
 const s=localStorage.getItem(LS);
 if(s){try{const k=await crypto.subtle.importKey("raw",b64d(s),"AES-GCM",false,["decrypt"]);
  if(await tryKey(k)){unlock();return}}catch(e){}
  localStorage.removeItem(LS);}
 $("#pw").focus();
})();
</script>
